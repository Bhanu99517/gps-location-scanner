name: Geo Location CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Get code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node (important for Vite 8)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20   # ⚠️ Important (Vite 8 needs Node 18+)

      # 3. Install dependencies
      - name: Install dependencies
        run: npm install

      # 4. Lint code
      - name: Run ESLint
        run: npm run lint

      # 5. Run tests (Vitest)
      - name: Run Tests
        run: npm run test

      # 6. Build project
      - name: Build project
        run: npm run build
